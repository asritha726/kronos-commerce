name: CI Build & Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Compile Java Backend
      run: |
        mkdir -p backend/bin
        javac -d backend/bin backend/src/com/fintech/oms/*.java

    - name: Test Docker Container Build
      run: |
        docker build -t kronos-commerce:test .
